name: Milepost

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
jobs:
  Tests:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_26.6.app/Contents/Developer'
    - name: Run Tests
      run: |
        swift test --verbose
